name: Demo

# Builds the static demo (the web UI, the exported index and the browser model) and publishes it on
# GitHub Pages: https://kyan9400.github.io/lumen-search/

on:
  push:
    branches: [main]
    paths: ["src/**", "corpus/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf
          key: hf-${{ hashFiles('scripts/build_browser_model.py', 'src/lumen/config.py') }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[demo]"
      - run: npm ci
      - name: Browser model (multilingual-e5-small, English and Russian vocabulary, int8)
        run: python scripts/build_browser_model.py build/browser-model
      - name: Index the corpus (OCR included)
        run: lumen --data-dir data ingest --manifest corpus/manifest.json
      - name: Assemble the site
        run: python scripts/build_demo.py --data-dir data --model-dir build/browser-model --out build/demo
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
