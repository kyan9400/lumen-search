[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lumen-search"
version = "0.1.0"
description = "Hybrid document search with citations: BM25 + multilingual embeddings + FAISS over PDF, Word, Excel and scanned pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alhassan Alfarran" }]
requires-python = ">=3.10"
keywords = ["search", "rag", "bm25", "faiss", "sentence-transformers", "ocr", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10.0",
  "snowballstemmer>=2.2",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "fakeredis>=2.23",
  "reportlab>=4.2",
]
# builds the browser copy of the embedding model for the static demo (scripts/build_browser_model.py)
demo = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
lumen = "lumen.cli:main"

[project.urls]
Homepage = "https://github.com/kyan9400/lumen-search"
Demo = "https://kyan9400.github.io/lumen-search/"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "ocr: needs the tesseract binary (skipped when it is not installed)",
  "model: downloads a real embedding model from the Hugging Face Hub",
]

[tool.coverage.run]
source = ["lumen"]
omit = ["src/lumen/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PIE", "RET", "PTH"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Cyrillic and typographic characters are intended
  "SIM905",  # word lists read better as """...""".split()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]

[tool.mypy]
python_version = "3.10"
files = ["src/lumen"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["faiss.*", "snowballstemmer.*", "docx.*", "openpyxl.*", "pypdfium2.*", "sentence_transformers.*", "scipy.*", "fakeredis.*", "reportlab.*", "onnxruntime.*"]
ignore_missing_imports = true
